name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm Trusted Publisher (OIDC) requires npm >= 11.5.1; no NODE_AUTH_TOKEN —
      # npm exchanges the job's OIDC id-token for a publish token automatically.
      - run: npm install -g npm@latest

      - name: Sync version from tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          npm version "$TAG" --no-git-tag-version --allow-same-version --ignore-scripts

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx tsc --noEmit --project tsconfig.tests.json
      - run: bun test
      - run: bun run build:openclaw

      - name: Pack tarball
        id: pack
        run: |
          # npm pack runs prepack (bun build) whose stdout pollutes the capture;
          # the tarball name is always the last line.
          file=$(npm pack --silent | tail -n 1)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Packed $file"
          tar -tzf "$file"

      - run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Generate changelog
        id: changelog
        run: |
          tag="$GITHUB_REF_NAME"
          prev=$(git tag --sort=-creatordate | grep -v "^${tag}$" | head -n1 || true)
          {
            echo "## ${tag}"
            echo
            if [ -n "$prev" ]; then
              echo "Changes since \`${prev}\`:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${prev}..${tag}"
              echo
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            else
              echo "Initial release."
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${tag}"
            fi
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.pack.outputs.file }}

      - name: Push version bump back to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet || (
            git commit -m "chore(release): ${GITHUB_REF_NAME#v} [skip ci]" &&
            git push origin HEAD:master
          )
